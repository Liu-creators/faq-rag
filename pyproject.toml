[project]
name = "faq-rag"
version = "0.1.0"
description = "FAQ RAG service powered by FastAPI"
readme = "README.md"
authors = [
    { name = "Liu", email = "2162233967@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
faq-rag = "faq_rag.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faq_rag"]
